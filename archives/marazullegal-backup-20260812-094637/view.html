<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer — Mar Azul</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a2e3b; }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #1a2e3b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid #2a4a5e;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .doc-title {
      color: #94a3b8;
      font-size: 14px;
      max-width: 50%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .download-btn {
      color: #0f766e;
      background: #f0fdfa;
      padding: 8px 16px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
    }
    .download-btn:hover { background: #ccfbf1; }
    .viewer {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .no-doc {
      color: #94a3b8;
      text-align: center;
      padding-top: 100px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/documents/" class="back-btn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Documents
    </a>
    <span class="doc-title" id="docTitle">Loading...</span>
    <a href="#" class="download-btn" id="downloadBtn" download>Download PDF</a>
  </div>
  <div class="viewer">
    <iframe id="pdfViewer"></iframe>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const doc = params.get('doc');
    if (doc) {
      const path = '/docs/' + doc;
      document.getElementById('pdfViewer').src = path;
      document.getElementById('docTitle').textContent = doc.replace('.pdf', '').replace(/-/g, ' ');
      document.getElementById('downloadBtn').href = path;
    } else {
      document.querySelector('.viewer').innerHTML = '<p class="no-doc">No document specified</p>';
    }
  </script>
</body>
</html>
