<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#7a8865"/>
  
  <!-- Sun glow -->
  <circle cx="100" cy="100" r="75" fill="#95a17f" opacity="0.5"/>
  
  <!-- Sun rays -->
  <g stroke="#f7be9f" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="155" y1="45" x2="141" y2="59"/>
    <line x1="180" y1="100" x2="160" y2="100"/>
    <line x1="155" y1="155" x2="141" y2="141"/>
    <line x1="100" y1="180" x2="100" y2="160"/>
    <line x1="45" y1="155" x2="59" y2="141"/>
    <line x1="20" y1="100" x2="40" y2="100"/>
    <line x1="45" y1="45" x2="59" y2="59"/>
  </g>
  
  <!-- Sun face -->
  <circle cx="100" cy="100" r="45" fill="#f7be9f"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="92" rx="5" ry="6" fill="#7a8865"/>
  <ellipse cx="115" cy="92" rx="5" ry="6" fill="#7a8865"/>
  
  <!-- Eye highlights -->
  <circle cx="83" cy="90" r="2" fill="white" opacity="0.7"/>
  <circle cx="113" cy="90" r="2" fill="white" opacity="0.7"/>
  
  <!-- Smile -->
  <path d="M75 110 Q100 135 125 110" stroke="#7a8865" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Rosy cheeks -->
  <circle cx="70" cy="105" r="8" fill="#ea7a47" opacity="0.3"/>
  <circle cx="130" cy="105" r="8" fill="#ea7a47" opacity="0.3"/>
</svg>
