<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#E8B4BC"/>
  
  <!-- Simple stroller silhouette -->
  <g transform="translate(22, 20)" fill="#5B7C99">
    <!-- Body -->
    <rect x="5" y="20" width="35" height="25" rx="5" fill="#5B7C99"/>
    <!-- Hood -->
    <ellipse cx="22" cy="18" rx="18" ry="12" fill="#5B7C99"/>
    <!-- Handle -->
    <rect x="38" y="5" width="4" height="25" rx="2" fill="#5B7C99"/>
    <!-- Wheels -->
    <circle cx="12" cy="52" r="7" fill="#FFFFFF"/>
    <circle cx="35" cy="52" r="7" fill="#FFFFFF"/>
  </g>
</svg>