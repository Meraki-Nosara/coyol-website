<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Baby stroller / pushchair - more cursive, friendly style -->
  
  <!-- Handle - curved elegant line -->
  <path d="M48 12 C56 12, 58 20, 54 28 C50 36, 48 40, 48 44" 
        stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Canopy/Hood - soft curved shape -->
  <path d="M18 26 C18 14, 44 14, 44 26 L44 32 C44 34, 42 36, 40 36 L22 36 C20 36, 18 34, 18 32 Z" 
        fill="currentColor" opacity="0.85"/>
  
  <!-- Stroller body - rounded basket -->
  <path d="M14 36 L48 36 L50 48 C50 50, 48 52, 46 52 L16 52 C14 52, 12 50, 12 48 Z" 
        fill="currentColor"/>
  
  <!-- Baby silhouette hint inside -->
  <ellipse cx="31" cy="44" rx="10" ry="6" fill="white" opacity="0.3"/>
  
  <!-- Wheels - cute round wheels -->
  <circle cx="18" cy="58" r="5" fill="currentColor"/>
  <circle cx="44" cy="58" r="5" fill="currentColor"/>
  
  <!-- Wheel centers -->
  <circle cx="18" cy="58" r="2" fill="white"/>
  <circle cx="44" cy="58" r="2" fill="white"/>
  
  <!-- Small front wheel -->
  <circle cx="50" cy="52" r="3" fill="currentColor"/>
  <circle cx="50" cy="52" r="1.2" fill="white"/>
</svg>
